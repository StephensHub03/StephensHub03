name: Update GitHub Activity Graph

on:
  schedule:
    - cron: '0 0 * * *' # Every night at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/section-06-activity.svg'

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Activity SVG
        run: python3 scripts/generate_activity_graph.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/section-06-activity.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(activity): refresh GitHub contribution graph [skip ci]" && git push)
