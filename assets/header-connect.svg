<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Section Header — Connect">
  <defs>
    <linearGradient id="hc-gold-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#F2EAE0"/>
      <stop offset="55%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>
    <filter id="hc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="32" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#C5A46D" font-weight="600">07  CONNECT</text>
  <text x="968" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#A79A98" text-anchor="end">OPEN INBOX</text>
  <text x="30" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F2EAE0">Let's build something <tspan font-style="italic" fill="#C5A46D">worth explaining.</tspan></text>
  <line x1="30" y1="104" x2="970" y2="104" stroke="#40202B" stroke-width="1"/>
  <rect x="420" y="103" width="160" height="2" fill="url(#hc-gold-node)"/>
  <circle cx="500" cy="104" r="3.5" fill="#C5A46D" filter="url(#hc-glow)"/>
</svg>
