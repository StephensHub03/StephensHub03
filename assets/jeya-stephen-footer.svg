<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Jeya Stephen — Signature Footer">
  <title>Jeya Stephen — Signature Footer</title>
  <defs>
    <!-- Background Gradient (Obsidian to Dark Wine to Deep Burgundy) -->
    <linearGradient id="jsf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050609"/>
      <stop offset="50%"  stop-color="#160910"/>
      <stop offset="100%" stop-color="#240e1b"/>
    </linearGradient>

    <!-- Center gold line gradient -->
    <linearGradient id="jsf-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#40202B" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#76243B" stop-opacity="0.6"/>
      <stop offset="48%"  stop-color="#C5A46D" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="52%"  stop-color="#C5A46D" stop-opacity="0.95"/>
      <stop offset="75%"  stop-color="#76243B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#40202B" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="jsf-gold-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="jsf-soft-text" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Container (Matching Image 5) -->
  <rect x="30" y="10" width="940" height="200" rx="16" fill="url(#jsf-bg)" stroke="#40202B" stroke-width="1.2"/>

  <!-- Ambient background speckles (subtle stars) -->
  <g fill="#C5A46D" opacity="0.35">
    <circle cx="120" cy="50" r="1"/>
    <circle cx="210" cy="160" r="0.8"/>
    <circle cx="280" cy="70" r="1.2"/>
    <circle cx="360" cy="140" r="0.75"/>
    <circle cx="640" cy="60" r="0.8"/>
    <circle cx="720" cy="150" r="1.2"/>
    <circle cx="790" cy="45" r="0.75"/>
    <circle cx="880" cy="130" r="1"/>
  </g>

  <!-- Large Editorial Signature (Italic Serif) -->
  <text x="500" y="78"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="64"
    font-style="italic"
    font-weight="700"
    text-anchor="middle"
    fill="#F2EAE0"
    filter="url(#jsf-soft-text)">Stephen</text>

  <!-- Horizontal divider line with central luminous gold node -->
  <line x1="160" y1="108" x2="840" y2="108" stroke="url(#jsf-line-grad)" stroke-width="1.5"/>
  <circle cx="500" cy="108" r="4" fill="#FFFFFF" filter="url(#jsf-gold-glow)"/>
  <circle cx="500" cy="108" r="7" fill="none" stroke="#C5A46D" stroke-width="0.8" opacity="0.7"/>

  <!-- Engineering Tagline (Georgia Italic) -->
  <text x="500" y="148"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16.5"
    font-style="italic"
    text-anchor="middle"
    fill="#F2EAE0"
    opacity="0.95">Building systems that can explain themselves.</text>

  <!-- Monospace Subtitle (All Caps Letterspaced) -->
  <text x="500" y="176"
    font-family="'SF Mono', Monaco, monospace"
    font-size="10"
    letter-spacing="3"
    text-anchor="middle"
    fill="#C5A46D"
    font-weight="600">ENGINEERING INTELLIGENCE · DESIGNING EXPERIENCES</text>
</svg>
