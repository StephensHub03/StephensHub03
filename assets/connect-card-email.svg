<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 135" width="305" height="135" role="img" aria-label="Direct Dispatch — Email Inbox">
  <title>Direct Dispatch — Email Inbox</title>
  <defs>
    <linearGradient id="email-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e0c18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12070e" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="301" height="131" rx="10"/>
    </clipPath>

    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C5A46D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g class="card-wrap">
    <!-- Card Base -->
    <rect class="card-bg" x="2" y="2" width="301" height="131" rx="10" fill="url(#email-bg)" stroke="#40202B" stroke-width="1.2"/>

    <!-- Active Scanline Gliding across Card -->
    <g clip-path="url(#card-clip)">
      <rect x="2" y="2" width="301" height="40" fill="url(#scan-beam)">
        <animate attributeName="y" values="2; 100; 2" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Top-left corner bracket -->
    <path d="M16,2 L2,2 L2,16" fill="none" stroke="#C5A46D" stroke-width="1.5" opacity="0.8"/>

    <!-- Gold Diamond Icon with Radar Pulse -->
    <polygon points="20,27 25,22 30,27 25,32" fill="#C5A46D" filter="url(#gold-glow)"/>
    <circle cx="25" cy="27" r="3" fill="none" stroke="#C5A46D" stroke-width="0.8">
      <animate attributeName="r" values="3; 7; 11" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8; 0.2; 0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Channel Tag -->
    <text x="38" y="30" font-family="'SF Mono', Monaco, monospace" font-size="10" letter-spacing="1.5" fill="#C5A46D" font-weight="600">DIRECT DISPATCH</text>

    <!-- Main Title -->
    <text x="20" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#F2EAE0">Email Inbox</text>

    <!-- Subtitle / Address -->
    <text x="20" y="85" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#A79A98">connect.stephen01@gmail.com</text>

    <!-- Divider Line with Traveling Energy Node -->
    <line x1="20" y1="99" x2="285" y2="99" stroke="#40202B" stroke-width="0.8"/>
    <circle cx="20" cy="99" r="1.5" fill="#C5A46D">
      <animate attributeName="cx" values="20; 285; 20" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Action Link Indicator with Animated Arrow -->
    <text class="action-text" x="20" y="117" font-family="'SF Mono', Monaco, monospace" font-size="9" font-weight="600" fill="#C5A46D" letter-spacing="1">PRIORITY RESPONSE · 24H <tspan class="arrow-icon"><animateTransform attributeName="transform" type="translate" values="0 0; 2 -2; 0 0" dur="1.8s" repeatCount="indefinite"/>↗</tspan></text>
  </g>
</svg>

