<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Toolkit — The tools I reach for">
  <title>Toolkit — The tools I reach for</title>
  <defs>
    <!-- Background gradients -->
    <linearGradient id="sot-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#160910"/>
      <stop offset="50%"  stop-color="#1a0b14"/>
      <stop offset="100%" stop-color="#240e1b"/>
    </linearGradient>

    <linearGradient id="sot-tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1c0b15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12070e" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="sot-gold-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#F2EAE0"/>
      <stop offset="55%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>

    <filter id="sot-gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══ SECTION HEADER (MATCHING REFERENCE IMAGE 3) ═══ -->
  <text x="32" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#C5A46D" font-weight="600">04  TOOLKIT</text>
  <text x="968" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#A79A98" text-anchor="end">LANGUAGES · AI · WEB · DATA · INFRA</text>

  <!-- Large Editorial Headline -->
  <text x="30" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F2EAE0">The tools I <tspan font-style="italic" fill="#C5A46D">reach for.</tspan></text>

  <!-- Thin Horizontal Rule with Center Node -->
  <line x1="30" y1="102" x2="970" y2="102" stroke="#40202B" stroke-width="1"/>
  <rect x="180" y="101" width="160" height="2" fill="url(#sot-gold-node)"/>
  <circle cx="260" cy="102" r="3.5" fill="#C5A46D" filter="url(#sot-gold-glow)"/>

  <!-- ═══ MAIN LARGE ROUNDED PANEL ═══ -->
  <rect x="30" y="126" width="940" height="414" rx="16" fill="url(#sot-card-bg)" stroke="#40202B" stroke-width="1.2"/>

  <!-- Dividing line between row 1 & row 2 inside panel -->
  <line x1="45" y1="333" x2="955" y2="333" stroke="#40202B" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.6"/>

  <!-- Diamond accents on divider -->
  <polygon points="345,333 349,329 353,333 349,337" fill="#C5A46D" opacity="0.8"/>
  <polygon points="655,333 659,329 663,333 659,337" fill="#C5A46D" opacity="0.8"/>
  <circle cx="880" cy="333" r="3" fill="#C5A46D" filter="url(#sot-gold-glow)" opacity="0.8"/>

  <!-- ═════════ ROW 1 (3 CARDS) ═════════ -->

  <!-- CARD 01: LANGUAGES -->
  <g transform="translate(54, 148)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <!-- Top-left corner accent -->
    <path d="M12,0 L0,0 L0,12" fill="none" stroke="#C5A46D" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">01  LANGUAGES</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#F2EAE0">Python</text>
    <text x="126" y="52" font-family="'SF Mono', Monaco, monospace" font-size="9" letter-spacing="1.5" fill="#C5A46D">PRIMARY</text>
    <text x="20" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#F2EAE0">JavaScript</text>
    <text x="20" y="136" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">TypeScript · SQL · C</text>
  </g>

  <!-- CARD 02: AI · ML · LLM -->
  <g transform="translate(360, 148)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <path d="M12,0 L0,0 L0,12" fill="none" stroke="#C5A46D" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">02  AI · ML · LLM</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#F2EAE0">LLMs · NLP</text>
    <text x="20" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#F2EAE0">Machine Learning</text>
    <text x="20" y="128" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#A79A98">Deep Learning · YOLOv8</text>
    <text x="20" y="148" font-family="'SF Mono', Monaco, monospace" font-size="9" letter-spacing="1" fill="#C5A46D" opacity="0.85">SCIKIT-LEARN · PYTORCH · OPENCV</text>
  </g>

  <!-- CARD 03: FRONTEND -->
  <g transform="translate(666, 148)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <path d="M12,0 L0,0 L0,12" fill="none" stroke="#C5A46D" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">03  FRONTEND</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#F2EAE0">React</text>
    <text x="20" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#F2EAE0">Next.js</text>
    <text x="20" y="136" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">Tailwind CSS · HTML · SVG</text>
  </g>

  <!-- ═════════ ROW 2 (3 CARDS) ═════════ -->

  <!-- CARD 04: BACKEND & APIS -->
  <g transform="translate(54, 350)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">04  BACKEND &amp; APIS</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#F2EAE0">Node.js · Express</text>
    <text x="20" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#F2EAE0">FastAPI · Flask</text>
    <text x="20" y="132" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">REST APIs · WebSockets</text>
    <text x="20" y="150" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="1" fill="#C5A46D" opacity="0.85">JWT AUTH · RBAC ARCHITECTURE</text>
  </g>

  <!-- CARD 05: DATA & INFRASTRUCTURE -->
  <g transform="translate(360, 350)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">05  DATA &amp; INFRASTRUCTURE</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#F2EAE0">MongoDB · PostgreSQL</text>
    <text x="20" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#F2EAE0">Docker · AWS</text>
    <text x="20" y="132" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">Firebase · Pinecone Vector DB</text>
    <text x="20" y="150" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="1" fill="#C5A46D" opacity="0.85">EMBEDDINGS · QUERY OPTIMIZATION</text>
  </g>

  <!-- CARD 06: TOOLS & FUNDAMENTALS -->
  <g transform="translate(666, 350)">
    <rect width="280" height="166" rx="10" fill="url(#sot-tile-bg)" stroke="#40202B" stroke-width="1"/>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">06  TOOLS &amp; FUNDAMENTALS</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#F2EAE0">Git · GitHub · Postman</text>
    <text x="20" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#F2EAE0">DSA · OS · DBMS · OOP</text>
    <text x="20" y="132" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">Computer Networks · Linux</text>
    <text x="20" y="150" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="1" fill="#C5A46D" opacity="0.85">SYSTEM DESIGN · PIPELINE TESTING</text>
  </g>
</svg>
