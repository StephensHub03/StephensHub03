<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Jeya Stephen — AI and Data Science Engineer">
  <title>Jeya Stephen — AI/ML Engineer · Full-Stack Developer</title>
  <defs>
    <!-- Background gradients (Obsidian to Dark Wine to Deep Burgundy) -->
    <linearGradient id="jsh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050609"/>
      <stop offset="50%"  stop-color="#160910"/>
      <stop offset="100%" stop-color="#481326" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="jsh-panel-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#76243B" stop-opacity="0.25"/>
      <stop offset="60%"  stop-color="#481326" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm Ivory to Antique Gold headline gradient -->
    <linearGradient id="jsh-name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#C5A46D"/>
    </linearGradient>

    <linearGradient id="jsh-gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#C5A46D" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#C5A46D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="jsh-bar-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#160910"/>
      <stop offset="50%"  stop-color="#481326" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="jsh-term-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#160910" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#481326" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Arch frame stroke with Antique Gold & Burgundy -->
    <linearGradient id="jsh-arch-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#76243B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#40202B" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="jsh-arch-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#160910"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="jsh-photo-overlay" x1="0%" y1="50%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#050609" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Edge vignettes -->
    <linearGradient id="jsh-vig-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050609" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jsh-vig-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050609" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Arch clip path -->
    <clipPath id="jsh-arch-clip">
      <path d="M664,46 Q664,14 697,14 L857,14 Q887,14 887,46 L887,318 Q887,323 882,323 L669,323 Q664,323 664,318 Z"/>
    </clipPath>

    <!-- Outer container clip -->
    <clipPath id="jsh-container-clip">
      <rect width="1000" height="420" rx="16" ry="16"/>
    </clipPath>

    <!-- Fine Grid Pattern -->
    <pattern id="jsh-tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#76243B" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#76243B" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="0.75" fill="#C5A46D" fill-opacity="0.25"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="jsh-gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="jsh-soft-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container with Rounded Border -->
  <g clip-path="url(#jsh-container-clip)">
    <!-- ═══ BACKGROUND ═══ -->
    <rect width="1000" height="420" fill="url(#jsh-bg)"/>

    <!-- Left side subtle glow wash -->
    <rect width="650" height="420" fill="url(#jsh-panel-glow)"/>

    <!-- ═══ TECHNICAL GRID ═══ -->
    <rect width="1000" height="420" fill="url(#jsh-tech-grid)"/>

    <!-- ═══ CORNER BRACKETS ═══ -->
    <g stroke="#C5A46D" stroke-width="1.2" fill="none" opacity="0.45">
      <polyline points="24,14 14,14 14,24"/>
      <polyline points="976,14 986,14 986,24"/>
      <polyline points="14,396 14,406 24,406"/>
      <polyline points="986,396 986,406 976,406"/>
    </g>

    <!-- ═══ TERMINAL CAPSULE (TOP-LEFT) ═══ -->
    <rect x="34" y="26" width="280" height="28" rx="14" fill="url(#jsh-term-bg)" stroke="#40202B" stroke-width="1"/>
    <circle cx="50" cy="40" r="4.5" fill="#C5A46D" opacity="0.85" filter="url(#jsh-gold-glow)"/>
    <text x="64" y="44"
      font-family="'SF Mono', Monaco, 'Courier New', monospace"
      font-size="11.5" fill="#F2EAE0" opacity="0.9">~/stephen $ build --intelligent</text>
    <rect x="272" y="33" width="6" height="14" fill="#C5A46D" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- ═══ CATEGORY SUBTITLE ROW ═══ -->
    <line x1="34" y1="76" x2="68" y2="76" stroke="#C5A46D" stroke-width="1.5" opacity="0.8"/>
    <text x="76" y="80"
      font-family="'SF Mono', Monaco, 'Courier New', monospace"
      font-size="10" letter-spacing="3" fill="#C5A46D" opacity="0.9" font-weight="600">AI · MACHINE LEARNING · FULL-STACK</text>

    <!-- ═══ HEADLINE NAME (EDITORIAL SERIF) ═══ -->
    <text x="32" y="172"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="88" font-weight="700"
      fill="url(#jsh-name-grad)"
      filter="url(#jsh-soft-glow)">Jeya</text>

    <text x="32" y="258"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="88" font-weight="700"
      fill="#F2EAE0">Stephen</text>
    <text x="382" y="258"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="88" font-weight="700"
      fill="#C5A46D" filter="url(#jsh-gold-glow)">.</text>

    <!-- Thin luminous antique-gold underline -->
    <rect x="34" y="274" width="365" height="1.5" fill="url(#jsh-gold-line)"/>

    <!-- ═══ ROLE LINE ═══ -->
    <text x="34" y="298"
      font-family="'SF Mono', Monaco, 'Courier New', monospace"
      font-size="10.5" letter-spacing="2" fill="#F2EAE0" opacity="0.8">AI/ML ENGINEER · FULL-STACK DEVELOPER · AI &amp; DATA SCIENCE</text>

    <!-- ═══ TAGLINE (ITALIC SERIF) ═══ -->
    <text x="34" y="324"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="13.5" font-style="italic" fill="#C5A46D" opacity="0.85">Engineering intelligence. Designing experiences.</text>

    <!-- ═══ BOTTOM INFORMATION STRIP ═══ -->
    <rect x="0" y="352" width="1000" height="34" fill="url(#jsh-bar-bg)"/>
    <line x1="0" y1="352" x2="1000" y2="352" stroke="#40202B" stroke-width="1"/>
    <text x="34" y="373"
      font-family="'SF Mono', Monaco, 'Courier New', monospace"
      font-size="9.5" letter-spacing="1.5" fill="#F2EAE0" opacity="0.75">B.TECH AI &amp; DATA SCIENCE · RAMCO INSTITUTE OF TECHNOLOGY</text>
    <text x="640" y="373"
      font-family="'SF Mono', Monaco, 'Courier New', monospace"
      font-size="9.5" letter-spacing="1.5" fill="#C5A46D" opacity="0.75">CHENNAI, INDIA · OPEN TO COLLABORATION</text>

    <!-- Narrow bottom edge line -->
    <rect x="0" y="386" width="1000" height="34" fill="#050609"/>
    <line x1="0" y1="386" x2="1000" y2="386" stroke="#40202B" stroke-width="1"/>

    <!-- ═══ RIGHT PANEL: ORBITAL GEOMETRY & ARCH ═══ -->
    <!-- Outer animated dashed orbit -->
    <ellipse cx="776" cy="178" rx="172" ry="130" fill="none" stroke="#481326" stroke-width="1" opacity="0.6" stroke-dasharray="4,8">
      <animateTransform attributeName="transform" type="rotate" from="0 776 178" to="360 776 178" dur="36s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Inner orbit (counter-rotate) -->
    <ellipse cx="776" cy="178" rx="114" ry="86" fill="none" stroke="#76243B" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,6">
      <animateTransform attributeName="transform" type="rotate" from="0 776 178" to="-360 776 178" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Luminous antique gold orbital node -->
    <circle r="3.5" fill="#C5A46D" filter="url(#jsh-gold-glow)" opacity="0.95">
      <animateMotion dur="36s" repeatCount="indefinite">
        <mpath href="#jsh-outer-path"/>
      </animateMotion>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <ellipse id="jsh-outer-path" cx="776" cy="178" rx="172" ry="130" fill="none" stroke="none" visibility="hidden"/>

    <!-- Oxblood inner node -->
    <circle r="2.8" fill="#76243B" filter="url(#jsh-gold-glow)" opacity="0.85">
      <animateMotion dur="24s" repeatCount="indefinite">
        <mpath href="#jsh-inner-path"/>
      </animateMotion>
    </circle>
    <ellipse id="jsh-inner-path" cx="776" cy="178" rx="114" ry="86" fill="none" stroke="none" visibility="hidden"/>

    <!-- ═══ ARCH FRAME WITH PORTRAIT ═══ -->
    <path d="M664,46 Q664,14 697,14 L857,14 Q887,14 887,46 L887,320 Q887,325 882,325 L669,325 Q664,325 664,320 Z"
      fill="url(#jsh-arch-fill)"/>

    <!-- Image inside Arch -->
    <image
      href="../public/me3.PNG"
      xlink:href="https://raw.githubusercontent.com/StephensHub03/StephensHub03/main/public/me3.PNG"
      x="664" y="14"
      width="223" height="311"
      preserveAspectRatio="xMidYMin slice"
      clip-path="url(#jsh-arch-clip)"/>

    <!-- Bottom Vignette inside Arch -->
    <path d="M664,46 Q664,14 697,14 L857,14 Q887,14 887,46 L887,320 Q887,325 882,325 L669,325 Q664,325 664,320 Z"
      fill="url(#jsh-photo-overlay)"/>

    <!-- Arch Frame Stroke (Gold & Burgundy gradient) -->
    <path d="M664,46 Q664,14 697,14 L857,14 Q887,14 887,46 L887,320 Q887,325 882,325 L669,325 Q664,325 664,320 Z"
      fill="none" stroke="url(#jsh-arch-stroke)" stroke-width="2"/>

    <!-- Inner Arch Highlight -->
    <path d="M674,46 Q674,24 697,24 L857,24 Q877,24 877,46"
      fill="none" stroke="#C5A46D" stroke-width="1" opacity="0.4"/>

    <!-- ═══ TECHNICAL NODES & LABELS ═══ -->
    <!-- LLM (Top Right) -->
    <circle cx="910" cy="74" r="3.5" fill="#C5A46D" filter="url(#jsh-gold-glow)"/>
    <line x1="887" y1="74" x2="907" y2="74" stroke="#76243B" stroke-width="1" opacity="0.8"/>
    <text x="918" y="78" font-family="'SF Mono', Monaco, monospace" font-size="10.5" letter-spacing="1" fill="#F2EAE0" opacity="0.9">LLM</text>

    <!-- API (Middle Right) -->
    <circle cx="918" cy="165" r="3.5" fill="#C5A46D" filter="url(#jsh-gold-glow)"/>
    <line x1="887" y1="165" x2="915" y2="165" stroke="#76243B" stroke-width="1" opacity="0.8"/>
    <text x="926" y="169" font-family="'SF Mono', Monaco, monospace" font-size="10.5" letter-spacing="1" fill="#F2EAE0" opacity="0.9">API</text>

    <!-- DATA (Bottom Right) -->
    <circle cx="914" cy="256" r="3.5" fill="#C5A46D" filter="url(#jsh-gold-glow)"/>
    <line x1="887" y1="256" x2="911" y2="256" stroke="#76243B" stroke-width="1" opacity="0.8"/>
    <text x="922" y="260" font-family="'SF Mono', Monaco, monospace" font-size="10.5" letter-spacing="1" fill="#F2EAE0" opacity="0.9">DATA</text>

    <!-- UI (Middle Left) -->
    <circle cx="640" cy="172" r="3.5" fill="#C5A46D" filter="url(#jsh-gold-glow)"/>
    <line x1="644" y1="172" x2="664" y2="172" stroke="#76243B" stroke-width="1" opacity="0.8"/>
    <text x="620" y="176" font-family="'SF Mono', Monaco, monospace" font-size="10.5" letter-spacing="1" fill="#F2EAE0" opacity="0.9">UI</text>

    <!-- Edge vignettes -->
    <rect x="0"   y="0" width="50"  height="420" fill="url(#jsh-vig-l)"/>
    <rect x="950" y="0" width="50"  height="420" fill="url(#jsh-vig-r)"/>
  </g>

  <!-- Outer container border -->
  <rect width="1000" height="420" rx="16" ry="16" fill="none" stroke="#40202B" stroke-width="1.5"/>
</svg>
