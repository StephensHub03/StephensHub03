<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="About Jeya Stephen — Who I Am">
  <title>About Jeya Stephen — Who I Am</title>
  <defs>
    <!-- Background gradients -->
    <linearGradient id="soa-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#160910"/>
      <stop offset="50%"  stop-color="#1a0b14"/>
      <stop offset="100%" stop-color="#240e1b"/>
    </linearGradient>

    <linearGradient id="soa-term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0508"/>
      <stop offset="100%" stop-color="#12070d"/>
    </linearGradient>

    <linearGradient id="soa-subcard-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#200d18" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#160910" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="soa-gold-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#F2EAE0"/>
      <stop offset="55%"  stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soa-gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Traveling Sheen Gradient -->
    <linearGradient id="soa-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0.8"/>
      <stop offset="25%"  stop-color="#C5A46D" stop-opacity="0.9"/>
      <stop offset="48%"  stop-color="#FFF8E7" stop-opacity="1"/>
      <stop offset="52%"  stop-color="#FFF8E7" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#C5A46D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0.8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 500 0; 500 0" dur="4.8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Scanline Beam Gradient -->
    <linearGradient id="soa-scan-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C5A46D" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C5A46D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="soa-term-clip">
      <rect width="570" height="370" rx="10"/>
    </clipPath>
  </defs>

  <!-- ═══ SECTION HEADER (MATCHING REFERENCE IMAGE 1) ═══ -->
  <text x="32" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#C5A46D" font-weight="600">01  ABOUT</text>
  <text x="968" y="32" font-family="'SF Mono', Monaco, monospace" font-size="11" letter-spacing="3" fill="#A79A98" text-anchor="end">WHO I AM</text>

  <!-- Large Editorial Headline -->
  <text x="30" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#F2EAE0">Hello, I'm <tspan font-style="italic" fill="url(#soa-sheen)">Stephen.</tspan></text>

  <!-- Thin Horizontal Rule with Active Traveling Energy Pulse -->
  <line x1="30" y1="102" x2="970" y2="102" stroke="#40202B" stroke-width="1"/>
  <rect y="101" width="160" height="2" fill="url(#soa-gold-node)">
    <animate attributeName="x" values="30; 810; 30" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cy="102" r="3.5" fill="#C5A46D" filter="url(#soa-gold-glow)">
    <animate attributeName="cx" values="110; 890; 110" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3; 5; 3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cy="102" r="6" fill="none" stroke="#C5A46D" stroke-width="1" opacity="0.6">
    <animate attributeName="cx" values="110; 890; 110" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4; 10; 4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8; 0.1; 0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ MAIN LARGE ROUNDED PANEL ═══ -->
  <rect x="30" y="126" width="940" height="414" rx="16" fill="url(#soa-card-bg)" stroke="#40202B" stroke-width="1.2"/>

  <!-- ═══ LEFT SIDE: SIMULATED TERMINAL WINDOW ═══ -->
  <g transform="translate(56, 148)">
    <!-- Terminal Background -->
    <rect width="570" height="370" rx="10" fill="url(#soa-term-bg)" stroke="#40202B" stroke-width="1"/>

    <!-- Terminal Active Laser Scanline Beam -->
    <g clip-path="url(#soa-term-clip)">
      <rect x="0" y="36" width="570" height="40" fill="url(#soa-scan-beam)" opacity="0.45">
        <animate attributeName="y" values="36; 325; 36" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Terminal Header Bar -->
    <path d="M0,10 Q0,0 10,0 L560,0 Q570,0 570,10 L570,36 L0,36 Z" fill="#160910"/>
    <line x1="0" y1="36" x2="570" y2="36" stroke="#40202B" stroke-width="0.8"/>

    <!-- Mac Window Dots (Deep Burgundy, Oxblood, Subtle Border) with Radar Beacon -->
    <circle cx="20" cy="18" r="4.5" fill="#76243B"/>
    <circle cx="20" cy="18" r="4.5" fill="none" stroke="#76243B" stroke-width="1.5">
      <animate attributeName="r" values="4.5; 11; 15" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8; 0.2; 0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="18" r="4.5" fill="#481326"/>
    <circle cx="52" cy="18" r="4.5" fill="#40202B"/>

    <!-- Window Title -->
    <text x="285" y="22" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#A79A98" text-anchor="middle">stephen@portfolio: ~</text>

    <!-- Terminal Body Commands (SF Mono font) -->
    <!-- Line 1: whoami -->
    <text x="24" y="66" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#C5A46D" font-weight="600">$ <tspan fill="#F2EAE0">whoami</tspan></text>
    <text x="24" y="86" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">→ Jeya Stephen · AI/ML Engineer · Full-Stack Developer</text>

    <!-- Line 2: cat education.txt -->
    <text x="24" y="118" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#C5A46D" font-weight="600">$ <tspan fill="#F2EAE0">cat education.txt</tspan></text>
    <text x="24" y="138" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">→ B.Tech AI &amp; Data Science · Ramco Institute of Technology</text>

    <!-- Line 3: cat experience.txt -->
    <text x="24" y="170" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#C5A46D" font-weight="600">$ <tspan fill="#F2EAE0">cat experience.txt</tspan></text>
    <text x="24" y="190" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#A79A98">→ AI Learning Platform · Black Light Technologies · 2026</text>
    <text x="24" y="208" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#A79A98">→ AI Question Paper Generator · Vinayaga Public School · 2025</text>
    <text x="24" y="226" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#A79A98">→ AI Object Detection System · Yaar Solutions · 2025</text>

    <!-- Line 4: ls ./shipped -->
    <text x="24" y="258" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#C5A46D" font-weight="600">$ <tspan fill="#F2EAE0">ls ./shipped</tspan></text>
    <text x="24" y="278" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">→ sentinelvision-ai  postly  hiresense-ai  voxcare  tweetsense  internx</text>

    <!-- Line 5: echo $PRINCIPLE -->
    <text x="24" y="310" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#C5A46D" font-weight="600">$ <tspan fill="#F2EAE0">echo $PRINCIPLE</tspan></text>
    <text x="24" y="330" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#A79A98">→ systems that hold up · AI whose answers can be checked</text>

    <!-- Blinking cursor -->
    <rect x="24" y="344" width="7" height="15" fill="#C5A46D" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ RIGHT SIDE: THREE STACKED INFORMATION CARDS ═══ -->
  <!-- Card 1: Primary Language -->
  <g transform="translate(644, 148)">
    <rect width="300" height="110" rx="10" fill="url(#soa-subcard-bg)" stroke="#40202B" stroke-width="1"/>
    <!-- Animated corner radar beacon -->
    <circle cx="282" cy="18" r="3" fill="#C5A46D" opacity="0.8"/>
    <circle cx="282" cy="18" r="3" fill="none" stroke="#C5A46D" stroke-width="1">
      <animate attributeName="r" values="3; 9; 14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0.2; 0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">PRIMARY LANGUAGE</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#F2EAE0">Python</text>
    <text x="20" y="88" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#A79A98">AI/ML pipelines · Computer Vision · NLP</text>
  </g>

  <!-- Card 2: Full-Stack Core -->
  <g transform="translate(644, 278)">
    <rect width="300" height="110" rx="10" fill="url(#soa-subcard-bg)" stroke="#40202B" stroke-width="1"/>
    <circle cx="282" cy="18" r="3" fill="#C5A46D" opacity="0.8"/>
    <circle cx="282" cy="18" r="3" fill="none" stroke="#C5A46D" stroke-width="1">
      <animate attributeName="r" values="3; 9; 14" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0.2; 0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">WHERE LOGIC MEETS UI</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#F2EAE0">JavaScript / TS</text>
    <text x="20" y="88" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#A79A98">React · Next.js · Node.js · Express</text>
  </g>

  <!-- Card 3: Drawn To -->
  <g transform="translate(644, 408)">
    <rect width="300" height="110" rx="10" fill="url(#soa-subcard-bg)" stroke="#40202B" stroke-width="1"/>
    <circle cx="282" cy="18" r="3" fill="#C5A46D" opacity="0.8"/>
    <circle cx="282" cy="18" r="3" fill="none" stroke="#C5A46D" stroke-width="1">
      <animate attributeName="r" values="3; 9; 14" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0.2; 0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="26" font-family="'SF Mono', Monaco, monospace" font-size="9.5" letter-spacing="2" fill="#C5A46D" font-weight="600">DRAWN TO</text>
    <text x="20" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#F2EAE0">System design</text>
    <text x="20" y="88" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#A79A98">cloud (AWS) · scalable microservices</text>
  </g>
</svg>
